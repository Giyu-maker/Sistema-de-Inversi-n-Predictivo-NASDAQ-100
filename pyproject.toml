[project]
name = "ritech-nasdaq100"
version = "0.1.0"
description = "Backend RiTech-NASDAQ100 — Sprint 2 (Walking Skeleton)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=42",
    "httpx>=0.27",
    "influxdb-client>=1.40",
    "numpy>=2",
    "pydantic>=2.7",
    # `torch` NO va aquí. Vive en el grupo `ai` y solo se instala en M1 (CUDA)
    # y en M2 (CPU, solo para pruebas). Ver PASO 3 / docs/despliegue.md.
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
