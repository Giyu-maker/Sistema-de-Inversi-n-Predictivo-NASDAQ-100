# RiTech-NASDAQ100 — Infraestructura de la Máquina 2 (Nodo Central)
#   Sprint 2, Ítem 4 : PostgreSQL 16 (relacional/auditoría) + InfluxDB 2.7 (velas 5M)
#   Sprint 3, Fase B : `api` (API de solo lectura) + `scheduler` (ciclo de 5 min)
# Todo junto: docker compose up -d --build   (requiere Docker en la Máquina 2)
# Los valores secretos salen de .env (no commiteado; plantilla en .env.m2.example),
# y la clave maestra de criptografía de .env.local (gitignored, permiso 600).

services:
  postgres:
    image: postgres:16
    container_name: ritech-postgres16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    ports:
      # Solo loopback: la BD no se expone a la red de la oficina (REST-05).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  influxdb:
    image: influxdb:2.7
    container_name: ritech-influxdb27
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:?Falta INFLUXDB_ADMIN_USER en .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?Falta INFLUXDB_ADMIN_PASSWORD en .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?Falta INFLUXDB_ORG en .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?Falta INFLUXDB_BUCKET en .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?Falta INFLUXDB_ADMIN_TOKEN en .env}
    ports:
      # Solo loopback: el bucket no se expone a la red de la oficina (REST-05).
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Sprint 3, Fase B — backend de M2 (imagen única: Dockerfile.backend)
  # ---------------------------------------------------------------------------
  # `network_mode: host` para api y scheduler, y NO es un apaño de desarrollo:
  #
  #  * En M2 todo (PostgreSQL, InfluxDB, api, scheduler) corre en LA MISMA
  #    máquina, así que la red que necesitan es la del propio host. Los
  #    contenedores de bases ya publican SOLO loopback (REST-05), y desde la
  #    red del host se alcanzan igual: 127.0.0.1:5432 y 127.0.0.1:8086.
  #  * Con esto el `.env` funciona SIN sobrescribir nada: PGHOST, INFLUXDB_URL,
  #    ENDPOINTS_* e INFERENCE_URL salen todos del entorno tal cual (§15.1).
  #    En la red por puentes haría falta `PGHOST=postgres` y compañía, que es
  #    otra configuración por entorno.
  #  * En desarrollo se confirmó que el firewall del host bloquea el tráfico
  #    del puente docker hacia el propio host: con red host el camino es el
  #    loopback y no depende de esa regla.
  #
  # El API sigue sin exponerse: `ENDPOINTS_HOST` por defecto es 127.0.0.1:8010.

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ritech-api
    restart: unless-stopped
    network_mode: host
    command: ["python", "-m", "src.endpoints"]
    env_file:
      - path: .env
        required: true
      # Desarrollo: CREDENTIALS_MASTER_KEY e INFERENCE_URL. En producción esta
      # clave maestra se queda en este archivo aparte de .env (la plantilla lo
      # explica): nunca junto a los secretos que ella descifra.
      - path: .env.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      # /api/health no toca ni PG ni Influx: mide que el proceso HTTP
      # responde, que es lo que quiere un healthcheck de contenedor. Lo que
      # pasa con los servicios de abajo lo dice /api/status (amarillo).
      test: ["CMD-SHELL", "python -c \"import os, urllib.request as u; u.urlopen('http://127.0.0.1:' + os.environ.get('ENDPOINTS_PORT', '8010') + '/api/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Ciclo de 5 minutos: Twelve Data → InfluxDB → inferencia en M1 →
  # ai_predictions → AsymmetricCalculator. Sin puertos: no escucha, solo habla.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ritech-scheduler
    restart: unless-stopped
    network_mode: host
    command: ["python", "-m", "src.ingestion.scheduler"]
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    # Sin healthcheck, deliberadamente: no expone ningún endpoint, y comprobar
    # desde dentro del propio contenedor que "el proceso sigue vivo" no dice
    # nada que `docker compose ps` y `restart: unless-stopped` no digan ya. Su
    # señal de vida real es el log de cada ciclo de 5 minutos
    # (`docker compose logs -f scheduler`), y sus efectos sobre los servicios
    # los cuenta /api/status del contenedor api.

volumes:
  pgdata:
    name: ritech-pgdata
  influxdb_data:
    name: ritech-influxdb2-data
  influxdb_config:
    name: ritech-influxdb2-config

# ============================================================================
# VERIFICACIÓN EN MÁQUINA 2
# ----------------------------------------------------------------------------
# Desde la raíz del proyecto:
#
#   1. Construir y levantar todo:
#        docker compose up -d --build
#   2. Estado (los cuatro contenedores deben quedar "healthy" o "running";
#      `scheduler` no declara healthcheck, ver su servicio):
#        docker compose ps
#   3. PostgreSQL responde:
#        docker compose exec postgres pg_isready -U ritech -d ritech
#   4. InfluxDB responde:
#        curl -f http://127.0.0.1:8086/health
#   5. El API responde (solo loopback en el host):
#        curl -f http://127.0.0.1:8010/api/health
#        curl -s http://127.0.0.1:8010/api/status
#   6. El ciclo corre cada 5 min:
#        docker compose logs -f scheduler
#   7. Detener (los volúmenes persistentes conservan los datos):
#        docker compose down
#
# Si `api` o `scheduler` quedan "unhealthy"/reiniciándose, el primer sitio a
# mirar es la plantilla de entorno: `.env` (faltan credenciales con `:?`) y
# `.env.local` (CREDENTIALS_MASTER_KEY, permiso 600).
# ============================================================================
